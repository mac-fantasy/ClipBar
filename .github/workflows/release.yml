name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-15
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      CLIPBAR_UPDATE_REPOSITORY: ${{ github.repository }}
      SPARKLE_PUBLIC_ED_KEY: ${{ secrets.SPARKLE_PUBLIC_ED_KEY }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set release version
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo 'Release tag must be a stable version such as v1.2.3' >&2
            exit 1
          fi
          test -n "$SPARKLE_PUBLIC_ED_KEY"
          echo "CLIPBAR_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: |
          swift test
          python3 -m unittest discover -s Tests/BuildTests

      - name: Build and sign update
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_ED_KEY: ${{ secrets.SPARKLE_PRIVATE_ED_KEY }}
        run: ./scripts/release.sh

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" \
            "dist/release/ClipBar-${CLIPBAR_VERSION}-macOS-universal.zip" \
            dist/release/appcast.xml \
            dist/release/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --generate-notes --title "ClipBar ${CLIPBAR_VERSION}"
